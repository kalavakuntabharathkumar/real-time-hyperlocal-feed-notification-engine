apiVersion: apps/v1
kind: Deployment
metadata: {name: hyperlocal-gateway}
spec:
 replicas: 2
 selector: {matchLabels: {app: hyperlocal-gateway}}
 template:
  metadata: {labels: {app: hyperlocal-gateway}}
  spec:
   containers:
   - name: gateway
     image: hyperlocal-gateway:local
     ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: hyperlocal-gateway}
spec:
 selector: {app: hyperlocal-gateway}
 ports: [{port: 80,targetPort: 8080}]
